<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1130" viewBox="0 0 1260 1130" role="img" aria-labelledby="title desc">
<title id="title">RiskLens — architecture and implementation status</title>
<desc id="desc">Implemented browser controls and rule-based inference; simulated fictional content; optional planned LLM is not connected. The flow relationships are listed below the component overview.</desc>
<rect width="1260" height="1130" fill="white"/>
<g font-family="Arial, sans-serif" fill="#173a34">
<text x="40" y="40" font-size="24">RiskLens — architecture and implementation status</text>
<text x="40" y="70" font-size="15">Component overview — see flow relationships below. Planned LLM has no connection.</text>
<g id="ui"><rect x="40" y="95" width="270" height="105" rx="10" fill="#e8f6ef" stroke="#3c8976" stroke-width="2"/>
<text x="52" y="121" font-size="14">Browser controls + session state</text>
<text x="52" y="183" font-size="14" font-weight="bold">[implemented]</text></g>
<g id="q"><rect x="340" y="95" width="270" height="105" rx="10" fill="#e8f6ef" stroke="#3c8976" stroke-width="2"/>
<text x="352" y="121" font-size="14">Five-question questionnaire</text>
<text x="352" y="183" font-size="14" font-weight="bold">[implemented]</text></g>
<g id="r"><rect x="640" y="95" width="270" height="105" rx="10" fill="#e8f6ef" stroke="#3c8976" stroke-width="2"/>
<text x="652" y="121" font-size="14">Rule-based risk inference</text>
<text x="652" y="183" font-size="14" font-weight="bold">[implemented]</text></g>
<g id="p"><rect x="940" y="95" width="270" height="105" rx="10" fill="#e8f6ef" stroke="#3c8976" stroke-width="2"/>
<text x="952" y="121" font-size="14">Profile + conflict clarification</text>
<text x="952" y="183" font-size="14" font-weight="bold">[implemented]</text></g>
<g id="s"><rect x="940" y="265" width="270" height="105" rx="10" fill="#e8f6ef" stroke="#3c8976" stroke-width="2"/>
<text x="952" y="291" font-size="14">Scenario selector + mode controls</text>
<text x="952" y="353" font-size="14" font-weight="bold">[implemented]</text></g>
<g id="d"><rect x="640" y="265" width="270" height="105" rx="10" fill="#fff1dd" stroke="#be8c3f" stroke-width="2"/>
<text x="652" y="291" font-size="14">Fictional portfolios + fixed</text>
<text x="652" y="311" font-size="14">advice</text>
<text x="652" y="353" font-size="14" font-weight="bold">[simulated]</text></g>
<g id="c"><rect x="340" y="265" width="270" height="105" rx="10" fill="#e8f6ef" stroke="#3c8976" stroke-width="2"/>
<text x="352" y="291" font-size="14">Risk-category comparator</text>
<text x="352" y="353" font-size="14" font-weight="bold">[implemented]</text></g>
<g id="v"><rect x="40" y="265" width="270" height="105" rx="10" fill="#e8f6ef" stroke="#3c8976" stroke-width="2"/>
<text x="52" y="291" font-size="14">Advice view; comparison only in</text>
<text x="52" y="311" font-size="14">Inspectable</text>
<text x="52" y="353" font-size="14" font-weight="bold">[implemented]</text></g>
<g id="f"><rect x="40" y="435" width="270" height="105" rx="10" fill="#e8f6ef" stroke="#3c8976" stroke-width="2"/>
<text x="52" y="461" font-size="14">Accept / decline feedback +</text>
<text x="52" y="481" font-size="14">history</text>
<text x="52" y="523" font-size="14" font-weight="bold">[implemented]</text></g>
<g id="l"><rect x="640" y="435" width="270" height="105" rx="10" fill="#f4f1fa" stroke="#9a7cb6" stroke-width="2" stroke-dasharray="6 4"/>
<text x="652" y="461" font-size="14">Optional LLM dialogue; not</text>
<text x="652" y="481" font-size="14">connected</text>
<text x="652" y="523" font-size="14" font-weight="bold">[planned]</text></g>
<text x="40" y="580" font-size="21">Flow relationships</text>
<text x="40" y="615" font-size="14">Browser controls + session state → Five-question questionnaire (answers)</text>
<text x="40" y="646" font-size="14">Five-question questionnaire → Rule-based risk inference (score)</text>
<text x="40" y="677" font-size="14">Rule-based risk inference → Profile + conflict clarification (category / conflict)</text>
<text x="40" y="708" font-size="14">Profile + conflict clarification → Five-question questionnaire (correct answers)</text>
<text x="40" y="739" font-size="14">Profile + conflict clarification → Scenario selector + mode controls (continue if ready)</text>
<text x="40" y="770" font-size="14">Scenario selector + mode controls → Fictional portfolios + fixed advice (select example)</text>
<text x="40" y="801" font-size="14">Fictional portfolios + fixed advice → Risk-category comparator (portfolio risk)</text>
<text x="40" y="832" font-size="14">Rule-based risk inference → Risk-category comparator (profile)</text>
<text x="40" y="863" font-size="14">Risk-category comparator → Advice view; comparison only in Inspectable (comparison data)</text>
<text x="40" y="894" font-size="14">Fictional portfolios + fixed advice → Advice view; comparison only in Inspectable (same advice in both modes)</text>
<text x="40" y="925" font-size="14">Scenario selector + mode controls → Advice view; comparison only in Inspectable (switch mode / scenario)</text>
<text x="40" y="956" font-size="14">Advice view; comparison only in Inspectable → Accept / decline feedback + history (accept / decline)</text>
<text x="40" y="987" font-size="14">Accept / decline feedback + history → Advice view; comparison only in Inspectable (reconsider)</text>
<text x="40" y="1018" font-size="14">Advice view; comparison only in Inspectable → Five-question questionnaire (edit profile)</text>
<text x="40" y="1049" font-size="14">Browser controls + session state → Browser controls + session state (reset to welcome; clear session)</text>
</g></svg>
